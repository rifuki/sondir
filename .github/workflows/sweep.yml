# Weekly proactive conflict discovery. `sondir sweep` probes every ecosystem
# crate pair at latest × latest through cargo's resolver; exit 5 means a
# conflict NOT yet in the facts DB appeared — open/extend an issue so it gets
# reproduced and recorded before users hit it.
name: sweep

on:
  schedule:
    - cron: "37 4 * * 1" # Mondays 04:37 UTC
  workflow_dispatch:
    inputs:
      compile:
        description: "Also cargo check every pair that resolves (slow: tens of minutes)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --release

      # --compile is dispatch-only, never scheduled: it really builds the
      # dependency trees, so it costs tens of minutes of runner time. The weekly
      # run stays resolver-only; reach for --compile when the ecosystem is
      # mid-migration and a resolvable graph might still not build.
      - name: run sondir sweep
        id: sweep
        env:
          SWEEP_FLAGS: ${{ inputs.compile && '--compile' || '' }}
        run: |
          # pipefail is load-bearing: without it `$?` after `| tee` is TEE's status,
          # which is always 0, so the alert below could never fire.
          set +e -o pipefail
          ./target/release/sondir sweep $SWEEP_FLAGS --json | tee sweep.json
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 0 = nothing new, 5 = new conflict candidates; anything else is a failure.
          if [ "$code" -ne 0 ] && [ "$code" -ne 5 ]; then exit "$code"; fi

      - name: alert — open or extend the discovery issue
        if: steps.sweep.outputs.code == '5'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="new ecosystem conflict discovered (sondir sweep)"
          body="$(printf 'Weekly sweep on %s found conflict candidate(s) not yet in the facts DB.\n\n```json\n%s\n```\n\nPlaybook: reproduce each NEW pair, add a [[conflicts]] entry with a pinned probe to facts/facts.toml, confirm with `sondir facts verify`, then re-run `sondir sweep` (must exit 0).' "$(date -u +%F)" "$(cat sweep.json)")"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
