# Conflicts cargo's RESOLVER accepts and rustc then rejects. Verified by probing
# with `cargo check` (must resolve, then FAIL to compile) instead of
# `generate-lockfile` — a [[conflicts]] entry here would report "resolves" and be
# marked stale forever.

[[compile_conflicts]]
id = "wincode-schema-split"
a = "the wincode 0.6 wave (republished after the cutover): solana-address >=2.7, solana-clock >=3.2, solana-hash >=4.6, solana-short-vec >=3.3, solana-instruction-error >=2.5, solana-transaction-error >=3.4, solana-epoch-rewards/-last-restart-slot/-slot-hashes/-slot-history >=3.2"
b = "the wincode 0.5 wave (not yet republished): solana-instruction 3.4.0 (still the newest release), solana-sysvar 4.1.0, solana-nonce 3.2.1, solana-transaction 4.1.5, solana-message 4.4.0, solana-account 4.3.1, solana-rent, solana-epoch-schedule, solana-fee-calculator, litesvm <=0.15.0"
why = "ROOT CAUSE: anza-xyz/solana-sdk#832 (`chore(deps)!: Bump wincode to 0.6.0`) merged 2026-07-21 and flipped the single [workspace.dependencies] wincode entry, so master is UNIFORMLY on 0.6 — only the crates.io republish lags, and it publishes leaf-first. Crates republished after the cutover carry ^0.6.0; those last published before it still carry ^0.5.0, and solana-instruction 3.4.0 (2026-04-07) is the one that matters because `Pubkey` is an alias over solana-address::Address: address 2.7.0 gained its Schema impls against 0.6's traits while instruction 3.4.0 derives against 0.5's. With both majors in one graph, `Pubkey` fails the trait bound and rustc rejects it (E0277) in solana-sysvar and solana-nonce. Cargo resolves the graph happily, so this is invisible to every resolve-level probe: `sweep` reported 66/66 clean on 2026-07-27, the same day a bare `cargo add litesvm@0.15` could not be built (canary c22/c24). Existing projects survive only because their Cargo.lock predates the split — `cargo update` walks straight into it. It also blocks ordinary upgrades, not just `cargo update`: bumping ephemeral-rollups-sdk 0.15.5 -> 0.16.2 pulls the 0.6 wave in and breaks the workspace's test build the same way (canary c25). NOTE the boundary is only crossed where both sides are actually compiled — a single crate can build fine while `cargo check --tests` on the same graph fails, so judge it on the build CI runs."
fix = "wait it out — this is a publish wave in flight, not a stalled migration. THE UNBLOCKING RELEASE IS solana-instruction 3.5.0 (or 3.4.1) built against wincode ^0.6.0; that alone clears the `Pubkey: SchemaWrite` error. A fully uniform 0.6 graph additionally needs solana-sysvar, solana-nonce, solana-transaction, solana-message, solana-account, solana-rent, solana-epoch-schedule and solana-fee-calculator republished, and litesvm 0.15.1/0.16 for litesvm users (LiteSVM/litesvm#386, maintainer committed 2026-07-26). Precedent: the 0.4->0.5 round took 7 days from the workspace bump to solana-instruction's republish, which puts this around 2026-07-28. Meanwhile an intact Cargo.lock holds the line; do not `cargo update`. Do NOT bound the 0.6-wave crates individually — ten crates moved, so that is ten bounds to remember to lift for a problem measured in days"
probe = ["litesvm@0.15"]
split_crate = "wincode"

