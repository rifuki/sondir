# Conflicts cargo's RESOLVER accepts and rustc then rejects. Verified by probing
# with `cargo check` (must resolve, then FAIL to compile) instead of
# `generate-lockfile` — a [[conflicts]] entry here would report "resolves" and be
# marked stale forever.

[[compile_conflicts]]
id = "wincode-schema-split"
a = "the wincode 0.6 wave, 13 crates republished after the cutover: solana-address >=2.7, solana-clock >=3.2, solana-hash >=4.6, solana-short-vec >=3.3, solana-instruction-error >=2.5, solana-transaction-error >=3.4, solana-hard-forks >=3.2, solana-inflation >=3.2, solana-reward-info >=6.3, solana-epoch-rewards/-last-restart-slot/-slot-hashes/-slot-history >=3.2"
b = "the wincode 0.5 wave (not yet republished): solana-instruction 3.4.0 (still the newest release), solana-sysvar 4.1.0, solana-nonce 3.2.1, solana-transaction 4.1.5, solana-message 4.4.0, solana-account 4.3.1, solana-rent, solana-epoch-schedule, solana-fee-calculator, litesvm <=0.15.0"
why = "ROOT CAUSE: anza-xyz/solana-sdk#832 (`chore(deps)!: Bump wincode to 0.6.0`) merged 2026-07-21 and flipped the single [workspace.dependencies] wincode entry, so master is UNIFORMLY on 0.6 — only the crates.io republish lags, and it publishes leaf-first. Crates republished after the cutover carry ^0.6.0; those last published before it still carry ^0.5.0, and solana-instruction 3.4.0 (2026-04-07) is the one that matters because `Pubkey` is an alias over solana-address::Address: address 2.7.0 gained its Schema impls against 0.6's traits while instruction 3.4.0 derives against 0.5's. With both majors in one graph, `Pubkey` fails the trait bound and rustc rejects it (E0277) in solana-sysvar and solana-nonce. Cargo resolves the graph happily, so this is invisible to every resolve-level probe: `sweep` reported 66/66 clean on 2026-07-27, the same day a bare `cargo add litesvm@0.15` could not be built (canary c22/c24). Existing projects survive only because their Cargo.lock predates the split — `cargo update` walks straight into it. THE TRAP IS BENEATH THE CRATES YOU CAN SEE: solana-instruction-error 2.5.0 and solana-transaction-error 3.4.0 (both 2026-07-23) are on 0.6 and are NON-OPTIONAL deps of the very crates listed on the 0.5 side. litesvm 0.15.0 hard-pins `wincode ^0.5.5` while its own mandatory `solana-instruction-error ^2.4.0` and `solana-transaction-error ^3.3.1` float up to the 0.6 releases — which is why a bare `cargo add litesvm@0.15` reproduces with no other dependency present. solana-instruction 3.4.0 has the same shape (`solana-instruction-error ^2.2.0` -> 2.5.0), so it is not the clean 0.5 island it looks like, and mollusk-svm 0.14.0 drags the wave in the same way with no direct wincode dep at all. ANY change that forces re-resolution of this subtree is enough — c25 bumped ephemeral-rollups-sdk 0.15.5 -> 0.16.2 and broke the build, but that release changes only `magicblock-delegation-program-api ^3.0.0 -> ^3.1.0`: the bump was merely the trigger, not the cause. NOTE the boundary is only crossed where both sides are actually compiled — a single crate can build fine while `cargo check --tests` on the same graph fails, so judge it on the build CI runs."
fix = "wait it out — this is a publish wave in flight, not a stalled migration. THE UNBLOCKING RELEASE IS solana-instruction 3.5.0 (or 3.4.1) built against wincode ^0.6.0; that alone clears the `Pubkey: SchemaWrite` error. A fully uniform 0.6 graph additionally needs solana-sysvar, solana-nonce, solana-transaction, solana-message, solana-account, solana-rent, solana-epoch-schedule and solana-fee-calculator republished, and litesvm 0.15.1/0.16 for litesvm users (LiteSVM/litesvm#386, maintainer committed 2026-07-26). Precedent: the 0.4->0.5 round took 7 days from the workspace bump to solana-instruction's republish, which puts this around 2026-07-28. Meanwhile an intact Cargo.lock is the ONLY thing holding the line — do not `cargo update`, and treat any manifest edit that re-resolves this subtree as the same hazard. Do NOT try to bound your way out: 13 crates moved, and two of them (solana-instruction-error, solana-transaction-error) sit UNDERNEATH solana-instruction, litesvm and mollusk-svm as non-optional deps, so no upper bound on the crates you can actually see will keep 0.6 out of the graph"
probe = ["litesvm@0.15"]
split_crate = "wincode"

# Same root cause as wincode-schema-split, different entry point — the shape this
# DB already uses for litesvm-light / mollusk-light. Separate rather than folded
# in, so each entry keeps a MINIMAL reproducer: `cargo add mollusk-svm@0.14` alone
# is enough, exactly as `cargo add litesvm@0.15` alone is.
[[compile_conflicts]]
id = "wincode-schema-split-mollusk"
a = "the wincode 0.6 wave — see wincode-schema-split for the full 13"
b = "mollusk-svm 0.14.0 and the 0.5-wave crates beneath it"
why = "mollusk-svm 0.14.0 has NO direct wincode dependency at all, which is what makes it the more instructive case: its NON-OPTIONAL solana-instruction-error ^2.1.0 and solana-transaction-error ^3.0.0 float up to the 2.5.0/3.4.0 releases that crossed to wincode 0.6, while the rest of its tree is still on 0.5. So the split arrives entirely through transitive deps and a bare `cargo add mollusk-svm@0.14` fails to compile with the identical `Pubkey: SchemaRead` E0277. Found by the first `sweep --compile` run (2026-07-27, canary c28): 10 of its 21 hits were mollusk pairs that the litesvm-only entry could not recognise — including anchor-lang x mollusk-svm, i.e. a plain Anchor + Mollusk project does not build today."
fix = "same as wincode-schema-split: wait for the Agave publish wave to reach solana-instruction (3.5.0/3.4.1 on wincode ^0.6.0). Bounding is not available here either — the two crates that moved are non-optional deps underneath mollusk-svm, not things you declare"
probe = ["mollusk-svm@0.14"]
split_crate = "wincode"

