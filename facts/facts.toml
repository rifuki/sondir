[[conflicts]]
id = "litesvm-magicblock"
a = "litesvm 0.13.x"
b = "ephemeral-rollups-sdk (vrf) / ephemeral-vrf-sdk >=0.4 (0.2.x and 0.3.x are all yanked)"
why = "litesvm 0.13.x pins solana-instruction =3.2.0 (Agave 4.0 wave) while the MagicBlock chain requires ^3.4 (Agave 4.1 wave); cargo cannot unify same-major exact vs caret. RESOLVED UPSTREAM: litesvm 0.14.0 (2026-07-13) moved to solana-instruction ^3.4.0 / agave-* ^4.1.1 — exactly the Agave-4.1-wave release this entry was waiting on (facts-verify 2026-07-27). Kept, bounded to 0.13.x, because `anchor init` (CLI 1.1.2) templates still ship litesvm 0.13.1, so fresh-project + MagicBlock hits this immediately (canary c05). NOTE the probe still fails, but the resolver's proximate complaint has drifted to solana-loader-v4-program 4.0.0 (pulled by litesvm 0.13.0 on backtrack) rather than solana-instruction =3.2.0 — same schism, different first casualty (audit c27)."
fix = "upgrade litesvm to >=0.14 (the Agave-4.1-wave release)"
# `@*` made cargo enumerate all 76 published versions and report a feature error
# on ancient 0.0.x releases instead of the conflict; >=0.15 keeps the failure
# output on-message without weakening the claim (audit c27).
probe = ["litesvm@>=0.13, <0.14", "ephemeral-rollups-sdk@>=0.15#anchor,vrf"]
fix_pin = "litesvm@0.14"

[[conflicts]]
id = "litesvm-instructions-sysvar"
a = "litesvm 0.13.x"
b = "solana-instructions-sysvar >=3.0.1"
why = "solana-instructions-sysvar 3.0.1+ (and the whole 4.x line, now at 4.0.0) requires solana-instruction ^3.4.0; litesvm 0.13.x pins =3.2.0 (canary c06). RESOLVED UPSTREAM in litesvm 0.14.0 (^3.4.0, facts-verify 2026-07-27). If you must stay on 0.13.x, the escapes remain sysvar =3.0.0 (rides ^3.0.0) or litesvm 0.12.x."
fix = "upgrade litesvm to >=0.14, or pin solana-instructions-sysvar = \"=3.0.0\""
probe = ["litesvm@>=0.13, <0.14", "solana-instructions-sysvar@>=3.0.1"]
fix_pin = "litesvm@0.14"

[[conflicts]]
id = "legacy-solana-program"
a = "solana-program 1.x (legacy)"
b = "modern anchor workspace (solana-* 3.x wave)"
why = "the legacy 1.x line drags curve25519-dalek 3.2.1 whose zeroize pin clashes with the modern tree (canary c19: `failed to select a version for zeroize`). Remove the direct solana-program dep and use anchor_lang re-exports (or granular solana-* 3.x crates)."
fix = "remove the direct solana-program dependency; use anchor_lang::solana_program re-exports"
