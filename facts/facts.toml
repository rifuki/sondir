[[conflicts]]
id = "litesvm-magicblock"
a = "litesvm 0.13.x"
b = "ephemeral-rollups-sdk (vrf) / ephemeral-vrf-sdk >=0.3"
why = "litesvm 0.13.x pins solana-instruction =3.2.0 (Agave 4.0 wave) while the MagicBlock chain requires ^3.4 (Agave 4.1 wave); cargo cannot unify same-major exact vs caret. RESOLVED UPSTREAM: litesvm 0.14.0 (2026-07-13) moved to solana-instruction ^3.4.0 / agave-* ^4.1.1 — exactly the Agave-4.1-wave release this entry was waiting on (facts-verify 2026-07-27). Kept, bounded to 0.13.x, because `anchor init` (CLI 1.1.2) templates still ship litesvm 0.13.1, so fresh-project + MagicBlock hits this immediately (canary c05)."
fix = "upgrade litesvm to >=0.14 (the Agave-4.1-wave release)"
probe = ["litesvm@>=0.13, <0.14", "ephemeral-rollups-sdk@*#anchor,vrf"]
fix_pin = "litesvm@0.14"

